name: verify-windows

# Settles, on a real Windows host, the question Wine Bug 60346 left open:
# does the window property store initialise its PROPVARIANT out parameter, and
# what does it return, when the property is not present?
#
# Wine returns E_NOTIMPL (0x80004001) and leaves *var untouched.
# First run on windows-latest: Windows returns S_OK (0x00000000) with
# vt = VT_EMPTY.  So Wine differs in both the return value and the out parameter.
#
# Run from Actions -> verify-windows -> Run workflow, then read the log.

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/wine-attachments/windows-verify/**'
      - '.github/workflows/verify-windows.yml'

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      # user32.lib is needed for the window handles (CreateWindowExW,
      # GetDesktopWindow, DestroyWindow); shell32.lib for the property store.
      - name: Build (MSVC)
        continue-on-error: true
        shell: cmd
        working-directory: docs/wine-attachments/windows-verify
        run: |
          cl /nologo /W4 /D_WIN32_WINNT=0x0601 /DNTDDI_VERSION=0x06010000 verify-windows.c ^
             /link shell32.lib ole32.lib propsys.lib uuid.lib user32.lib /out:verify-windows.exe

      - name: Build (MinGW)
        continue-on-error: true
        shell: cmd
        working-directory: docs/wine-attachments/windows-verify
        run: |
          gcc -O2 -Wall -Wextra -o verify-windows-mingw.exe verify-windows.c -lshell32 -lole32 -luuid

      - name: Run whichever build succeeded
        shell: cmd
        working-directory: docs/wine-attachments/windows-verify
        run: |
          if exist verify-windows.exe verify-windows.exe
          if exist verify-windows-mingw.exe verify-windows-mingw.exe
          exit /b 0
